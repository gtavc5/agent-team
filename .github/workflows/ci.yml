name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: |
          npm install -g @earendil-works/pi-coding-agent@1.6.0
          npm install --prefix "$HOME/.pi/agent/npm" pi-subagents@0.90.0
          printf '%s\n' '{"packages":["npm:pi-subagents"]}' > "$HOME/.pi/agent/settings.json"
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Replay the same queue and subagent browser chains
        run: npm run test:e2e -w service -- journey-pilot-
      - name: Check deliberate Stop, single crash recovery and file-lock release
        run: npm test -w service -- tests/snap/snap.test.ts deterministic-process-exit.test.ts
      - if: runner.os == 'Linux'
        name: Prove missing Pi fails closed
        run: |
          if PI_BINARY=yaat-no-such-pi npm run test:e2e -w service -- pi-deterministic > "$RUNNER_TEMP/pi-negative.log" 2>&1; then exit 1; fi
          grep -F 'Pi E2E requires the pi binary' "$RUNNER_TEMP/pi-negative.log"
      - if: runner.os == 'Linux'
        name: Run remaining E2E, including real offline Pi
        run: npm run test:e2e -w service -- --exclude '**/journey-pilot-*.test.ts' --reporter=verbose
      - if: runner.os == 'Windows'
        name: Run remaining offline browser journeys
        run: npm run test:e2e -w service -- demo-browser journey- --exclude '**/journey-pilot-*.test.ts'
      - name: Run remaining service tests without orphan-shutdown stress
        run: npm test -w service -- --tagsFilter='!shutdown-stress' --exclude '**/snap.test.ts' --exclude '**/deterministic-process-exit.test.ts'
      - run: npm test -w webview
