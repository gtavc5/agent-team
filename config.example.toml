# Agent Team Configuration
# Copy this file to config.toml and fill in your values:
#   cp config.example.toml config.toml

# Server settings
[server]
# URL for remote image/file uploads (optional)
# remote_uploads_url = "http://your-server/uploads"
# Explicit service-manager restart command. Required to enable self-restart on macOS.
# restart_command = ["launchctl", "kickstart", "-k", "gui/501/com.example.agent-team"]

# Authentication (optional — remove this section to disable auth)
[auth]
username = "agent"
# Plain-text password checked against the form input.
# For production, consider hashing; the server compares raw values.
password = "changeme"
# Random hex string used to sign session cookies. Generate with:
#   openssl rand -hex 32
session_secret = "generate-a-random-hex-string"
max_age_days = 30

# Workspace housekeeping
[workspace]
# Workspaces with no activity for this many days are archived automatically:
# they move to the sidebar's "Archived" section, their history leaves memory
# (still on disk, restored when opened) and idle CLI processes are shut down.
# Sending a message to an archived workspace restores it. 0 disables.
archive_after_days = 14

# Hosts — currently only "local" type is supported
[hosts.local]
label = "Local"
type = "local"

# Pi (optional)
# [pi]
# packages = []
# exclude_packages = []
# default_model = "provider/model"
# default_effort = "medium"
# offline = false

# Projects (optional): the model a new project's lead runs on, and the
# workers it starts without naming one. Any model from the picker; effort if
# the model has it.
# [projects]
# model = "provider/model"
# effort = "medium"

# External LLM providers (optional)
# The provider name must be a prefix of the model ID you want to route.
# [providers.deepseek]
# api_key = "your-api-key"
# base_url = "https://api.deepseek.com/anthropic"
